<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vampire Survivordle</title>
    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap">
    <style>
        /* Menu de jeu : panneau central bleu nuit à double liseré or, comme les menus de Vampire Survivors */
        :root {
            color-scheme: dark;
            --gold: #c7953b;
            --gold-light: #f3d38a;
            --gold-dark: #7a5518;
            --panel: rgba(20, 16, 40, 0.88);
            --panel-solid: #191433;
            --navy: #2f3468;
            --navy-hover: #444a8c;
            --ink: #f6ead2;
            --ink-dim: #b9ad95;
            --good: #52a046;
            --mid: #e88c28;
            --bad: #e23434;
            --font: 'Pixelify Sans', 'Courier New', Courier, monospace;
            --tile: 100px;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            font-family: var(--font);
            color: var(--ink);
            background: #120808 url('images/background.webp') no-repeat center top fixed;
            background-size: cover;
            min-height: 100vh;
            overflow-x: hidden;
            padding-block: 16px 48px;
            padding-left: max(12px, env(safe-area-inset-left, 0px));
            padding-right: max(12px, env(safe-area-inset-right, 0px));
        }
        body::after {
            /* vignette pour détacher le panneau du fond */
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: -1;
        }
        button, input, textarea { font-family: inherit; }
        :focus-visible { outline: 2px solid var(--gold-light); outline-offset: 2px; }

        .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

        /* ---------- En-tête ---------- */
        header { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
        header img { width: 100%; max-width: 340px; justify-self: center; filter: drop-shadow(0 0 14px rgba(255, 200, 80, 0.35)); }
        .icon-btn {
            width: 44px; height: 44px;
            display: grid; place-items: center;
            background: var(--panel);
            border: 2px solid var(--gold);
            border-radius: 6px;
            color: var(--gold-light);
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: inset 0 0 0 2px var(--panel-solid), 0 2px 0 var(--gold-dark);
        }
        .icon-btn:hover { background: var(--navy); }
        .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }

        /* ---------- Panneau ---------- */
        .panel {
            background: var(--panel);
            border: 3px solid var(--gold);
            border-radius: 8px;
            box-shadow: inset 0 0 0 3px var(--panel-solid), inset 0 0 0 4px var(--gold-dark), 0 6px 24px rgba(0,0,0,0.6);
            padding: clamp(10px, 3vw, 16px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .category { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        @media (max-width: 520px) { .category { grid-template-columns: 1fr 1fr; } }
        .cat {
            padding: 10px 8px;
            background: rgba(0,0,0,0.3);
            border: 2px solid var(--gold-dark);
            border-radius: 6px;
            color: var(--ink-dim);
            font-size: clamp(14px, 3.8vw, 17px);
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
        }
        .cat:hover { color: var(--ink); border-color: var(--gold); }
        .cat.active { color: var(--gold-light); border-color: var(--gold); background: var(--navy); box-shadow: 0 3px 0 var(--gold-dark), inset 0 0 12px rgba(243,211,138,0.15); }
        .stats-label { text-align: center; font-size: 12px !important; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.06em; }
        .abbr { font-size: 12px !important; color: var(--ink-dim); line-height: 1.6 !important; }
        .credit { font-size: 13px !important; color: var(--ink-dim); }
        .credit a { color: var(--gold-light); }
        .tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; background: rgba(0,0,0,0.35); border-radius: 6px; padding: 4px; gap: 4px; }
        .tab {
            padding: 8px 4px;
            white-space: nowrap;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: var(--ink-dim);
            font-size: clamp(13px, 3.6vw, 16px);
            font-weight: 500;
            cursor: pointer;
        }
        .tab:hover { color: var(--ink); }
        .tab.active { background: var(--gold); color: #1d1020; font-weight: 700; box-shadow: 0 2px 0 var(--gold-dark); }

        .meta { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--ink-dim); gap: 8px; flex-wrap: wrap; }
        .meta b { color: var(--gold-light); font-weight: 500; }

        .search { position: relative; display: flex; gap: 8px; }
        #searchInput {
            flex: 1;
            min-width: 0;
            padding: 12px 14px;
            background: rgba(0,0,0,0.45);
            border: 2px solid var(--gold-dark);
            border-radius: 6px;
            color: var(--ink);
            font-size: 18px;
        }
        #searchInput::placeholder { color: #8c8270; }
        #searchInput:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(199,149,59,0.25); }
        #searchInput:disabled { opacity: 0.45; }

        .btn {
            padding: 10px 16px;
            background: var(--navy);
            border: 2px solid var(--gold);
            border-radius: 6px;
            color: var(--ink);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--gold-dark);
            transition: transform 0.05s;
        }
        .btn:hover:not(:disabled) { background: var(--navy-hover); }
        .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-dark); }
        .btn:disabled { opacity: 0.4; cursor: default; }
        .btn.primary { background: var(--gold); color: #1d1020; }
        .btn.primary:hover:not(:disabled) { background: var(--gold-light); }
        .btn.ghost { background: transparent; border-color: var(--gold-dark); color: var(--ink-dim); box-shadow: none; font-weight: 500; font-size: 14px; padding: 7px 12px; }
        .btn.ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--gold); background: rgba(255,255,255,0.04); }

        #suggestions {
            position: absolute;
            top: calc(100% + 6px);
            left: 0; right: 0;
            background: var(--panel-solid);
            border: 2px solid var(--gold);
            border-radius: 6px;
            max-height: 260px;
            overflow-y: auto;
            display: none;
            z-index: 5;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        #suggestions div {
            padding: 9px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 16px;
        }
        #suggestions div + div { border-top: 1px solid rgba(199,149,59,0.15); }
        #suggestions div.sel, #suggestions div:hover { background: rgba(199,149,59,0.22); }
        #suggestions small { color: var(--ink-dim); font-size: 12px; text-align: right; align-self: center; }
        #suggestions mark { background: none; color: var(--gold-light); }

        .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

        #archiveBar { display: none; align-items: center; justify-content: center; gap: 8px; font-size: 15px; }
        #archiveDate {
            background: rgba(0,0,0,0.45); color: var(--ink); border: 2px solid var(--gold-dark); border-radius: 6px;
            padding: 6px 8px; font-family: inherit; font-size: 15px;
        }
        .options { font-size: 14px; color: var(--ink-dim); }
        .options summary { cursor: pointer; text-align: center; padding: 2px; }
        .options summary:hover { color: var(--ink); }
        .options[open] { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: rgba(0,0,0,0.3); border-radius: 6px; }
        .opt { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .opt input { accent-color: var(--gold); width: 16px; height: 16px; flex-shrink: 0; }
        .opt small { font-size: 12px; }
        .transfer { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; border-top: 1px solid rgba(199,149,59,0.25); }
        .transfer .actions { justify-content: flex-start; }
        #transferBox {
            width: 100%; resize: vertical; font-family: inherit; font-size: 12px;
            background: rgba(0,0,0,0.45); color: var(--ink); border: 1px solid var(--gold-dark); border-radius: 6px; padding: 6px;
        }
        #candidates { display: none; padding: 10px 12px; background: rgba(0,0,0,0.3); border-radius: 6px; }
        #candidates .label { display: block; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold-light); margin-bottom: 6px; }
        .chips { display: flex; flex-wrap: wrap; gap: 4px; max-height: 150px; overflow-y: auto; }
        .chip { font-family: inherit; font-size: 13px; color: var(--ink); background: var(--navy); border: 1px solid var(--gold-dark); border-radius: 4px; padding: 3px 7px; cursor: pointer; }
        .chip:hover { border-color: var(--gold); }
        .chips .more { font-size: 13px; color: var(--ink-dim); align-self: center; }
        .tile .shared { display: block; font-size: 0.8em; text-decoration: underline; color: #fff6c8; margin-top: 2px; }
        .hard { display: none; align-items: center; justify-content: center; gap: 8px; font-size: 14px; color: var(--ink-dim); cursor: pointer; }
        .hard input { accent-color: var(--gold); width: 16px; height: 16px; }
        .hard small { font-size: 12px; }
        #prompt, #bonus {
            display: none;
            padding: 12px 14px;
            border-radius: 6px;
            line-height: 1.4;
        }
        #prompt { background: rgba(0,0,0,0.4); border: 2px solid var(--gold); font-size: 17px; text-align: center; }
        #bonus { background: rgba(82,160,70,0.15); border: 1px solid var(--good); font-size: 15px; }
        #prompt .label, #bonus .label, .hint .label { display: block; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold-light); margin-bottom: 2px; }
        #hints { display: none; flex-direction: column; gap: 6px; }
        .hint.revealed { opacity: 0.75; border-style: dotted; }
        .hit { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 2px; color: #fff6c8; }
        .hitcount { display: block; font-size: 0.85em; }
        .guess { display: flex; flex-direction: column; gap: 2px; }
        .guess-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
            text-align: left;
            padding: 2px 4px;
            border-left: 3px solid var(--bad);
            text-shadow: 0 1px 3px #000;
        }
        .guess-name.correct-name { border-left-color: var(--good); color: #b8f0a8; }
        .guess.instant .tile { animation: none; }
        .guess.win .tile { animation: flip 0.5s ease both, bounce 0.45s ease 0.9s; }
        .hint {
            display: block;
            padding: 10px 14px;
            background: rgba(243, 211, 138, 0.08);
            border: 1px dashed var(--gold);
            border-radius: 6px;
            font-size: 15px;
            line-height: 1.4;
            color: var(--ink);
        }

        #resultBar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            padding: 10px 14px;
            border-radius: 6px;
            background: rgba(82, 160, 70, 0.18);
            border: 1px solid var(--good);
            font-size: 16px;
        }
        #resultBar.lost { background: rgba(226, 52, 52, 0.15); border-color: var(--bad); }

        /* ---------- Grille ---------- */
        #board { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .row { display: flex; gap: 4px; }
        #specHeader { display: none; }
        #specHeader div {
            width: var(--tile);
            text-align: center;
            font-size: clamp(8px, calc(var(--tile) * 0.115), 13px);
            letter-spacing: 0.02em;
            overflow-wrap: anywhere;
            text-transform: uppercase;
            color: var(--gold-light);
            text-shadow: 0 1px 4px #000;
            padding-bottom: 2px;
            border-bottom: 2px solid var(--gold-dark);
        }
        .tile {
            width: var(--tile);
            height: var(--tile);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: calc(var(--tile) * 0.08);
            background-size: 100% 100%;
            image-rendering: pixelated;
            text-align: center;
            font-size: clamp(9px, calc(var(--tile) * 0.135), 15px);
            font-weight: 500;
            line-height: 1.1;
            text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 0 0 3px #000;
            overflow-wrap: break-word;
            hyphens: auto;
            animation: flip 0.5s ease both;
        }
        .row .tile:nth-child(2) { animation-delay: 0.12s; }
        .row .tile:nth-child(3) { animation-delay: 0.24s; }
        .row .tile:nth-child(4) { animation-delay: 0.36s; }
        .row .tile:nth-child(5) { animation-delay: 0.48s; }
        .row .tile:nth-child(6) { animation-delay: 0.6s; }

        .tile.dense { font-size: clamp(8px, calc(var(--tile) * 0.105), 12px); }
        #results { display: flex; flex-direction: column; gap: 8px; }
        .tile .arrow { font-size: 1.7em; line-height: 1; }
        @keyframes flip {
            0% { transform: rotateX(90deg); opacity: 0; }
            60% { transform: rotateX(-12deg); opacity: 1; }
            100% { transform: rotateX(0); opacity: 1; }
        }

        @keyframes bounce { 50% { transform: translateY(-8px); } }
        .correct { background-image: url('images/Green.png'); }
        .partial { background-image: url('images/Orange.png'); }
        .wrong { background-image: url('images/Red.png'); }
        /* Mode daltonien : bleu / orange / gris + symbole dans chaque case */
        body.cb .correct { background-image: url('images/Blue.png'); }
        body.cb .wrong { background-image: url('images/Grey.png'); }
        body.cb .tile, body.cb .sw { position: relative; }
        body.cb .tile::after, body.cb .sw::after {
            position: absolute; top: 3px; right: 5px;
            font-size: 11px; font-weight: 700; line-height: 1; text-shadow: 0 0 3px #000;
        }
        body.cb .correct::after { content: '✓'; }
        body.cb .partial::after { content: '~'; }
        body.cb .wrong::after { content: '✗'; }
        body.cb .guess-name { border-left-color: #8a8a96; }
        body.cb .guess-name.correct-name { border-left-color: #3478d6; color: #a9cbff; }

        .empty {
            text-align: center;
            color: var(--ink-dim);
            font-size: 15px;
            padding: 6px 0 2px;
        }

        /* ---------- Fenêtres ---------- */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 3, 10, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 20;
        }
        .overlay.open { display: flex; animation: fade 0.2s ease; }
        @keyframes fade { from { opacity: 0; } }
        .modal { background: var(--panel-solid); width: min(440px, 100%); max-height: 88vh; position: relative; }
        .modal-body { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; padding-right: 4px; }
        #helpModal .modal > .btn { flex-shrink: 0; }
        #endModal .modal { overflow-y: auto; }
        .modal h2 { margin: 0; font-size: 24px; color: var(--gold-light); text-align: center; letter-spacing: 0.04em; }
        .modal p { margin: 0; line-height: 1.45; font-size: 15px; }
        .modal .close { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; font-size: 18px; }
        .rule { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; font-size: 15px; }
        .sw { width: 40px; height: 40px; background-size: 100% 100%; image-rendering: pixelated; display: grid; place-items: center; font-size: 18px; text-shadow: 1px 1px 0 #000; }

        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
        .stats div { background: rgba(0,0,0,0.35); border-radius: 6px; padding: 8px 2px; }
        .stats b { display: block; font-size: 26px; color: var(--gold-light); font-variant-numeric: tabular-nums; }
        .stats span { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.05em; }
        #endTitle.lost { color: #ff9a8a; }
        #endWeapon { text-align: center; font-size: 20px; }
        #endWeapon small { display: block; font-size: 13px; color: var(--ink-dim); margin-top: 2px; }
        #countdown { text-align: center; font-size: 14px; color: var(--ink-dim); }
        #countdown b { color: var(--gold-light); font-size: 20px; font-variant-numeric: tabular-nums; display: block; }
        #countdown small { display: block; font-size: 12px; color: var(--ink-dim); }
        #shareFallback {
            display: none;
            width: 100%;
            background: rgba(0,0,0,0.5);
            color: var(--ink);
            border: 1px solid var(--gold);
            border-radius: 6px;
            padding: 8px;
            resize: none;
            font-size: 14px;
        }

        #uploadContainer { display: none; font-size: 15px; text-align: center; }
        #uploadContainer p { margin: 0 0 8px; }

        #toast {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top, 0px));
            left: 50%;
            transform: translate(-50%, -10px);
            background: var(--panel-solid);
            border: 2px solid var(--gold);
            padding: 10px 16px;
            border-radius: 6px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 30;
            font-size: 16px;
        }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }
        .shake { animation: shake 0.3s; }
        @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        /* ---------- Fusion avec la version locale : en-tête, langues, icônes, flèches ---------- */
        header { grid-template-columns: 96px 1fr 96px; }
        .head-side { display: flex; gap: 8px; }
        .head-side.right { justify-content: flex-end; }
        @media (max-width: 420px) {
            header { grid-template-columns: 84px 1fr 84px; }
            .head-side { gap: 4px; }
            .head-side .icon-btn { width: 40px; height: 40px; }
        }
        .lang-wrap { position: relative; }
        .lang-btn span { font-size: 15px; letter-spacing: 0.04em; }
        .lang-menu {
            display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 15;
            background: var(--panel-solid); border: 2px solid var(--gold); border-radius: 6px; padding: 4px; min-width: 150px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .lang-menu.open { display: flex; flex-direction: column; }
        .lang-menu button {
            font-family: inherit; font-size: 15px; color: var(--ink); background: none; border: 0; text-align: left;
            padding: 8px 10px; border-radius: 4px; cursor: pointer;
        }
        .lang-menu button:hover { background: rgba(199,149,59,0.22); }
        #soundBtn #soundOff { display: none; }
        #soundBtn.muted #soundOff { display: inline; }
        #soundBtn.muted #soundWaves { display: none; }
        #soundBtn.muted { color: var(--ink-dim); }
        a.btn { text-decoration: none; display: inline-flex; align-items: center; }

        .ico { width: 1.25em; height: 1.25em; image-rendering: pixelated; object-fit: contain; vertical-align: -0.25em; flex-shrink: 0; }
        .ico-fallback {
            display: inline-grid; place-items: center; border-radius: 4px; background: var(--navy);
            border: 1px solid var(--gold-dark); color: var(--gold-light); font-size: 0.75em; font-weight: 700;
        }
        .ico-name { width: 22px; height: 22px; margin-right: 6px; }
        .ico-lg { width: 26px; height: 26px; margin-right: 4px; }
        .ico-xl { width: 64px; height: 64px; display: block; margin: 0 auto 6px; font-size: 32px; }
        .guess-name { display: flex; align-items: center; }
        .sugg-name { display: inline-flex; align-items: center; gap: 6px; }
        .sugg-name .ico-name { margin-right: 0; }
        .prompt-item { display: inline-flex; align-items: center; gap: 2px; }
        .tile-icons { display: flex; gap: 2px; justify-content: center; margin-bottom: 2px; }
        .ico-tile { width: calc(var(--tile) * 0.28); height: calc(var(--tile) * 0.28); }
        .hit-ico { outline: 2px solid #fff6c8; outline-offset: 1px; border-radius: 2px; }
        .tile.up { background-image: url('images/Up.png'); }
        .tile.down { background-image: url('images/Down.png'); }
        .sw.up { background-image: url('images/Up.png'); }
        body.cb .tile.up, body.cb .sw.up { background-image: url('images/UpGrey.png'); }
        body.cb .tile.down { background-image: url('images/DownGrey.png'); }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <div class="head-side">
            <button class="icon-btn" id="helpBtn" onclick="openModal('helpModal')">?</button>
            <div class="lang-wrap">
                <button class="icon-btn lang-btn" id="langBtn" onclick="toggleLangMenu()" aria-haspopup="true"><span id="langCode">FR</span></button>
                <div class="lang-menu" id="langMenu" role="menu">
                    <button role="menuitem" onclick="setLanguage('fr')">FR · Français</button>
                    <button role="menuitem" onclick="setLanguage('en')">EN · English</button>
                    <button role="menuitem" onclick="setLanguage('es')">ES · Español</button>
                </div>
            </div>
        </div>
        <img src="images/logo.png" alt="Vampire Survivordle">
        <div class="head-side right">
            <button class="icon-btn" id="soundBtn" onclick="setOption('sound', !options.sound)">

<script src="lang/fr.js"></script>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
    const HINT_STEPS = [3, 5, 7];   // nombre d'essais qui débloque chaque indice
    const MAX_GUESSES = 8;

    const STAT_ABBR = {
        'Recovery': 'Rec', 'Armor': 'Arm', 'Move Speed': 'MS', 'Might': 'Mgt', 'Speed': 'Spd', 'Duration': 'Dur',
        'Area': 'Area', 'Cooldown': 'CD', 'Amount': 'Amt', 'Revival': 'Rev', 'Magnet': 'Mag', 'Luck': 'Lck',
        'Growth': 'Grw', 'Greed': 'Grd', 'Curse': 'Crs', 'Reroll': 'Rrl', 'Skip': 'Skp', 'Banish': 'Ban',
    };

    // ---------- Utilitaires ----------
    const $ = id => document.getElementById(id);
    const normalize = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    const slug = s => normalize(s).replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    const splitList = s => (s || '').split(',').map(t => t.trim()).filter(Boolean);
    const el = (tag, props = {}, ...children) => { const e = Object.assign(document.createElement(tag), props); e.append(...children); return e; };
    const storage = {
        get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
        set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    };
    function hash(str) {   // FNV-1a : repli si une date n'est pas dans le calendrier
        let h = 2166136261;
        for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
        return h >>> 0;
    }

    // ---------- Langues ----------
    const LANGS = window.VSDLE_LANG || {};
    const browserLang = (navigator.language || 'fr').slice(0, 2);
    let lang = storage.get('vsdle-lang') || (LANGS[browserLang] ? browserLang : 'fr');
    if (!LANGS[lang]) lang = 'fr';
    function t(key, vars = {}) {
        let s = (LANGS[lang] && LANGS[lang][key]) ?? (LANGS.fr && LANGS.fr[key]) ?? key;
        for (const [k, v] of Object.entries(vars)) s = s.split('{' + k + '}').join(v);
        return s;
    }
    const tn = (key, n, vars = {}) => t(`${key}_${n === 1 ? 'one' : 'other'}`, { n, ...vars });
    const tv = value => t('val.' + value) === 'val.' + value ? value : t('val.' + value);   // valeur de données traduite
    const locale = () => t('meta.locale');

    function applyTranslations() {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(e => { e.placeholder = t(e.dataset.i18nPlaceholder); });
        document.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', t(e.dataset.i18nAria)); });
        for (const [id, key] of [['helpBtn', 'aria.help'], ['statsBtn', 'aria.stats'], ['langBtn', 'aria.lang'], ['soundBtn', 'aria.sound']]) {
            $(id).setAttribute('aria-label', t(key));
            $(id).title = t(key);
        }
        $('langCode').textContent = lang.toUpperCase();
        $('limitLabel').textContent = t('opt.limit', { n: MAX_GUESSES });
        $('helpHints').textContent = t('help.hints', { steps: HINT_STEPS.join(', ') });
    }

    function toggleLangMenu() { $('langMenu').classList.toggle('open'); }
    document.addEventListener('click', e => { if (!e.target.closest('.lang-wrap')) $('langMenu').classList.remove('open'); });
    function setLanguage(code) {
        lang = code;
        storage.set('vsdle-lang', code);
        $('langMenu').classList.remove('open');
        applyTranslations();
        if (data.length) startGame(mode, true);   // re-dessine la partie en cours dans la nouvelle langue
    }

    // ---------- Icônes (armes, évolutions, objets) ----------
    // images/icons.json : { weapons: { slug: fichier }, items: {…}, characters: {…} } (généré par tools/fetch_icons.py)
    let iconIndex = {};
    const iconsReady = (window.VSDLE_INLINE_ICONS
        ? Promise.resolve(window.VSDLE_INLINE_ICONS)
        : fetch('images/icons.json').then(r => r.ok ? r.json() : null)).then(j => { if (j) iconIndex = j; }).catch(() => {});
    function iconUrl(kind, name) {
        const file = iconIndex[kind] && iconIndex[kind][slug(name)];
        if (!file) return null;
        return file.startsWith('data:') ? file : `images/${kind}/${file}`;
    }
    // Icône d'un nom, ou pastille avec l'initiale quand l'image manque.
    function icon(kind, name, cls = 'ico') {
        const url = iconUrl(kind, name);
        if (url) return el('img', { className: cls, src: url, alt: '', loading: 'lazy' });
        return el('span', { className: cls + ' ico-fallback', textContent: (name || '?').charAt(0), ariaHidden: 'true' });
    }

    // ---------- Sons (Web Audio, sans fichier) ----------
    const SFX = (() => {
        let ctx = null;
        const ac = () => {
            if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') ctx.resume();
            return ctx;
        };
        const play = fn => { if (!options.sound) return; try { fn(ac()); } catch (e) {} };
        function osc(a, type, freq, start, dur) {
            const o = a.createOscillator(), g = a.createGain();
            o.type = type; o.frequency.setValueAtTime(freq, start);
            g.gain.setValueAtTime(0, start);
            o.connect(g); g.connect(a.destination);
            o.start(start); o.stop(start + dur);
            return { o, g };
        }
        function env(g, now, atk, sus, rel, vol = 0.3) {
            g.gain.setValueAtTime(0, now);
            g.gain.linearRampToValueAtTime(vol, now + atk);
            g.gain.setValueAtTime(vol, now + atk + sus);
            g.gain.exponentialRampToValueAtTime(0.0001, now + atk + sus + rel);
        }
        return {
            correct: () => play(a => { const n = a.currentTime; [[440, 'triangle'], [554, 'triangle'], [660, 'sine']].forEach(([f, ty], i) => env(osc(a, ty, f, n + i * 0.11, 0.5).g, n + i * 0.11, 0.01, 0.08, 0.28, 0.28)); }),
            wrong: () => play(a => { const n = a.currentTime; const { o, g } = osc(a, 'sawtooth', 130, n, 0.45); o.frequency.exponentialRampToValueAtTime(55, n + 0.35); env(g, n, 0.02, 0.05, 0.35, 0.22); }),
            partial: () => play(a => { const n = a.currentTime; [[330, 'sine'], [370, 'triangle']].forEach(([f, ty], i) => env(osc(a, ty, f, n + i * 0.1, 0.35).g, n + i * 0.1, 0.01, 0.05, 0.25, 0.2)); }),
            up: () => play(a => { const n = a.currentTime; const { o, g } = osc(a, 'sine', 220, n, 0.25); o.frequency.exponentialRampToValueAtTime(520, n + 0.2); env(g, n, 0.01, 0.05, 0.18, 0.22); }),
            down: () => play(a => { const n = a.currentTime; const { o, g } = osc(a, 'sine', 480, n, 0.25); o.frequency.exponentialRampToValueAtTime(180, n + 0.2); env(g, n, 0.01, 0.05, 0.18, 0.22); }),
            victory: () => play(a => {
                const n = a.currentTime;
                [261, 329, 392, 523, 659, 784].forEach((f, i) => env(osc(a, 'triangle', f, n + i * 0.09, 1.0).g, n + i * 0.09, 0.02, 0.1, 0.7, 0.25));
                [196, 294].forEach(f => env(osc(a, 'sine', f, n + 0.5, 2.0).g, n + 0.5, 0.15, 0.8, 0.9, 0.1));
            }),
            error: () => play(a => { const n = a.currentTime; [200, 170].forEach((f, i) => env(osc(a, 'square', f, n + i * 0.12, 0.1).g, n + i * 0.12, 0.01, 0.02, 0.08, 0.12)); }),
        };
    })();

    function launchConfetti() {
        if (typeof confetti !== 'function' || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const end = Date.now() + 2500;
        const timer = setInterval(() => {
            if (Date.now() > end) return clearInterval(timer);
            confetti({ startVelocity: 35, spread: 360, ticks: 90, zIndex: 999, particleCount: 40, origin: { x: Math.random(), y: Math.random() * 0.5 } });
        }, 150);
    }

    // ---------- Heure de Paris ----------
    // Les défis suivent l'heure de Paris pour tout le monde : même défi au même moment, partout.
    const parisParts = (d = new Date()) => Object.fromEntries(new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
    }).formatToParts(d).map(p => [p.type, p.value]));
    const todayKey = () => { const p = parisParts(); return `${p.year}-${p.month}-${p.day}`; };
    function shiftDay(key, days) {
        const d = new Date(key + 'T12:00:00Z');
        d.setUTCDate(d.getUTCDate() + days);
        return d.toISOString().slice(0, 10);
    }
    const yesterdayKey = () => shiftDay(todayKey(), -1);
    const secondsToParisMidnight = () => { const p = parisParts(); return 86400 - (+p.hour * 3600 + +p.minute * 60 + +p.second); };
    const formatDay = (key, opts) => new Date(key + 'T12:00:00Z').toLocaleDateString(locale(), { timeZone: 'UTC', ...opts });

    // ---------- Catégories ----------
    // Types de colonnes : exact · set (liste, orange si un élément en commun) · linked (arme comparée par ses tags)
    //                     number / date / ordinal (flèches : plus haut / plus récent / plus tard)
    const namePattern = name => name.split(' ').map(w => w.replace(/[A-Za-zÀ-ÿ0-9]/g, '_')).join('  ');
    const firstLetter = d => t('hint.firstLetter', { c: d['Nom'].charAt(0) });
    const evolvesInto = name => name === 'Aucune' ? t('hint.noEvolution') : t('hint.evolvesInto', { x: name });

    const CATEGORIES = {
        weapons: {
            files: ['data.csv'],
            seed: 'vsdle-w-', dailyKey: 'vsdle-daily-v2-weapons', statsKey: 'vsdle-stats',
            build: ([w]) => w,
            columns: [
                { key: 'Tags', label: 'col.tags', type: 'set' },
                { key: 'Colors', label: 'col.colors', type: 'set', translate: true },
                { key: 'Evolution Item', label: 'col.item', type: 'set', icons: 'items' },
                { key: 'Base Damage', label: 'col.damage', type: 'number' },
                { key: 'Unlock Time', label: 'col.unlockTime', type: 'ordinal', order: ['Early', 'Mid', 'Late'], translate: true },
                { key: 'Source', label: 'col.source', type: 'exact', translate: true },
            ],
            // Défi du jour : pas les armes « sélecteurs » (Candybox, Coat of Arms…)
            easy: d => !splitList(d['Tags']).includes('Choice'),
            hints: [firstLetter, d => d['Description'], d => evolvesInto(d['Evolution'])],
        },
        characters: {
            files: ['characters.csv'],
            seed: 'vsdle-c-', dailyKey: 'vsdle-daily-v2-characters', statsKey: 'vsdle-stats-characters',
            build: ([c]) => c,
            columns: [
                { key: 'Arme', label: 'col.weapon', type: 'linked', tagsKey: 'Weapon Tags', icons: 'weapons' },
                { key: 'Source', label: 'col.source', type: 'exact', translate: true },
                { key: 'Unlock Type', label: 'col.unlock', type: 'exact', translate: true },
                { key: 'Max Health', label: 'col.hp', type: 'number' },
                { key: 'Bonus', label: 'col.stats', type: 'set', abbr: true },
                { key: 'Release', label: 'col.release', type: 'date' },
            ],
            easy: d => d['Secret'] === 'Non',
            hints: [firstLetter, d => d['Description'] || t('hint.noDescription'), d => t('hint.unlock', { x: d['Unlock'] })],
        },
        evolutions: {
            files: ['evolutions.csv'],
            seed: 'vsdle-e-', dailyKey: 'vsdle-daily-v2-evolutions', statsKey: 'vsdle-stats-evolutions',
            build: ([e]) => e,
            prompt: d => d['Objets'] === 'Aucun'
                ? { label: t('prompt.noItem'), text: t('prompt.union'), items: [] }
                : { label: tn('prompt.items', splitList(d['Objets']).length), text: d['Objets'], items: splitList(d['Objets']) },
            columns: [
                { key: 'Armes', label: 'col.baseWeapons', type: 'set', icons: 'weapons' },
                { key: 'Base Tags', label: 'col.tags', type: 'set' },
                { key: 'Release', label: 'col.release', type: 'number' },
                { key: 'Source', label: 'col.source', type: 'exact', translate: true },
            ],
            easy: d => d['Type'] === 'Évolution' && d['Objets'] !== 'Aucun',
            hints: [firstLetter, d => t('hint.pattern', { p: namePattern(d['Nom']) }), d => t('hint.baseWeapon', { x: splitList(d['Armes'])[0] })],
        },
        descriptions: {
            files: ['data.csv', 'characters.csv'],
            seed: 'vsdle-d-', dailyKey: 'vsdle-daily-v2-descriptions', statsKey: 'vsdle-stats-descriptions',
            build: ([weapons, chars]) => {
                const all = [
                    ...weapons.map(w => ({ 'Nom': w['Nom'], 'Type': 'Arme', 'Source': w['Source'], 'Release': w['Release'], 'Tags': w['Tags'], 'Description': w['Description'], 'Evolution': w['Evolution'] })),
                    ...chars.filter(c => !weapons.some(w => w['Nom'] === c['Nom']))
                        .map(c => ({ 'Nom': c['Nom'], 'Type': 'Personnage', 'Source': c['Source'], 'Release': (c['Release'] || '').slice(0, 4) || 'N/A', 'Tags': c['Weapon Tags'], 'Description': c['Description'], 'Secret': c['Secret'], 'Start': c['Arme'] })),
                ];
                // seule une description unique, qui ne cite pas le nom, peut être la réponse
                const counts = {};
                all.forEach(d => { const k = normalize(d['Description']); counts[k] = (counts[k] || 0) + 1; });
                all.forEach(d => {
                    const desc = normalize(d['Description']);
                    d.playable = desc.length > 20 && counts[desc] === 1
                        && !normalize(d['Nom']).split(' ').some(w => w.length > 3 && desc.includes(w));
                });
                return all;
            },
            prompt: d => ({ label: t('prompt.description'), text: d['Description'] }),
            columns: [
                { key: 'Type', label: 'col.type', type: 'exact', translate: true },
                { key: 'Tags', label: 'col.weaponTags', type: 'set' },
                { key: 'Source', label: 'col.source', type: 'exact', translate: true },
                { key: 'Release', label: 'col.release', type: 'number' },
            ],
            canBeSecret: d => d.playable,
            easy: d => d.playable && d['Secret'] !== 'Oui',
            hints: [firstLetter, d => t('hint.pattern', { p: namePattern(d['Nom']) }),
                d => d['Type'] === 'Arme' ? evolvesInto(d['Evolution']) : t('hint.startWeapon', { x: d['Start'] })],
        },
    };

    // ---------- État ----------
    const files = {};
    let category = 'weapons';
    let cfg = CATEGORIES.weapons;
    let data = [];
    let secretItem = null;
    let mode = 'daily';
    let hard = storage.get('vsdle-hard') === true;
    const options = Object.assign({ limit: false, cands: false, cb: false, sound: false }, storage.get('vsdle-options') || {});
    let archiveDate = null;
    let guesses = [];
    let rowStates = [];
    let hintsUsed = 0;
    let finished = false;
    let won = false;
    let suggestionIndex = -1;
    let countdownTimer = null;

    function syncOptionInputs() {
        $('hardMode').checked = hard;
        $('limitMode').checked = options.limit;
        $('candMode').checked = options.cands;
        $('cbMode').checked = options.cb;
        $('soundMode').checked = options.sound;
        document.body.classList.toggle('cb', options.cb);
        $('soundBtn').classList.toggle('muted', !options.sound);
    }

    function setOption(key, value) {
        options[key] = value;
        storage.set('vsdle-options', options);
        syncOptionInputs();
        renderCandidates();
        updateStatus();
    }

    let toastTimer;
    function toast(msg) {
        const box = $('toast');
        box.textContent = msg;
        box.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => box.classList.remove('show'), 2200);
    }
    function shake(e) { e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }
    function openModal(id) { $(id).classList.add('open'); }
    function closeModal(id) { $(id).classList.remove('open'); if (id === 'endModal') clearInterval(countdownTimer); }
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { document.querySelectorAll('.overlay.open').forEach(o => closeModal(o.id)); $('langMenu').classList.remove('open'); }
    });

    // La grille remplit toujours la largeur du panneau, quel que soit le nombre de colonnes.
    function sizeTiles() {
        const n = cfg.columns.length;
        const w = $('board').clientWidth;
        const tile = Math.max(46, Math.min(112, Math.floor((w - (n - 1) * 4) / n)));
        document.documentElement.style.setProperty('--tile', tile + 'px');
    }
    window.addEventListener('resize', sizeTiles);

    // ---------- Chargement ----------
    function parseCSV(text) {
        const rows = [];
        let row = [], field = '', inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (inQuotes) {
                if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
                else if (c === '"') inQuotes = false;
                else field += c;
            } else if (c === '"') inQuotes = true;
            else if (c === ',') { row.push(field); field = ''; }
            else if (c === '\n' || c === '\r') {
                if (c === '\r' && text[i + 1] === '\n') i++;
                row.push(field); field = '';
                if (row.some(v => v !== '')) rows.push(row);
                row = [];
            } else field += c;
        }
        row.push(field);
        if (row.some(v => v !== '')) rows.push(row);
        const headers = rows[0].map(h => h.replace(/^﻿/, '').trim());
        return rows.slice(1).map(values => {
            const obj = {};
            headers.forEach((h, i) => obj[h] = (values[i] || '').trim());
            return obj;
        }).filter(d => d['Nom']);
    }

    let pendingFile = null;
    function loadFile(name) {
        if (files[name]) return Promise.resolve(files[name]);
        const inline = window.VSDLE_INLINE_CSV && window.VSDLE_INLINE_CSV[name];
        if (inline) return Promise.resolve(files[name] = parseCSV(inline));
        return fetch(name)
            .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
            .then(text => (files[name] = parseCSV(text)))
            .catch(err => { pendingFile = name; throw err; });
    }

    function showUpload() {
        $('uploadText').textContent = t('upload.text', { file: pendingFile });
        for (const id of ['searchContainer', 'gameActions', 'prompt', 'bonus', 'hints', 'resultBar', 'emptyState']) $(id).style.display = 'none';
        $('uploadContainer').style.display = 'block';
        $('modeLabel').textContent = '';
        $('guessCount').textContent = '';
        $('results').innerHTML = '';
        $('specHeader').style.display = 'none';
    }

    $('fileInput').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file || !pendingFile) return;
        const reader = new FileReader();
        reader.onload = ev => {
            files[pendingFile] = parseCSV(ev.target.result);
            e.target.value = '';
            switchCategory(category);
        };
        reader.readAsText(file);
    });

    // Calendrier figé (daily.json) ; à défaut, tirage déterministe sur la date.
    let calendar = null;
    const calendarReady = (window.VSDLE_INLINE_CALENDAR ? Promise.resolve(window.VSDLE_INLINE_CALENDAR)
        : fetch('daily.json').then(r => r.ok ? r.json() : null)).then(c => { calendar = c; }).catch(() => {});

    const builtCache = {};
    function switchCategory(cat) {
        category = cat;
        cfg = CATEGORIES[cat];
        storage.set('vsdle-category', cat);
        document.querySelectorAll('.cat').forEach(b => {
            b.classList.toggle('active', b.dataset.cat === cat);
            b.setAttribute('aria-selected', b.dataset.cat === cat);
        });
        $('modeLabel').textContent = t('app.loading');
        sizeTiles();
        Promise.all([...cfg.files.map(loadFile), calendarReady, iconsReady])
            .then(lists => {
                if (category !== cat) return;
                data = builtCache[cat] || (builtCache[cat] = cfg.build(lists.slice(0, cfg.files.length)));
                $('uploadContainer').style.display = 'none';
                $('searchContainer').style.display = 'flex';
                secretItem = null;
                startGame('daily');
            })
            .catch(() => { if (category === cat) showUpload(); });
    }

    // Réponses possibles : défi du jour = sélection accessible ; partie libre = idem, ou tout en mode difficile.
    const canBeSecret = d => !cfg.canBeSecret || cfg.canBeSecret(d);
    const easyPool = () => data.filter(d => canBeSecret(d) && cfg.easy(d));
    const fullPool = () => data.filter(canBeSecret);

    function setHardMode(on) {
        hard = on;
        storage.set('vsdle-hard', on);
        if (mode === 'free') startGame('free');
    }

    function dailySecret(date) {
        const planned = calendar && calendar[category] && calendar[category][date];
        const item = planned && data.find(d => d['Nom'] === planned);
        if (item) return item;
        const pool = easyPool();
        return pool[hash(cfg.seed + date) % pool.length];
    }

    // Archives : les 30 jours précédents, avec ✓ / ✗ selon le résultat enregistré
    function fillArchive() {
        const select = $('archiveDate');
        const keep = select.value;
        const saved = storage.get(cfg.dailyKey + '-archive') || {};
        select.innerHTML = '';
        for (let i = 1; i <= 30; i++) {
            const key = shiftDay(todayKey(), -i);
            const st = saved[key];
            const mark = !st ? '' : st.won ? ' ✓' : (st.gaveUp || st.lost) ? ' ✗' : ' …';
            select.appendChild(el('option', { value: key, textContent: formatDay(key, { weekday: 'short', day: 'numeric', month: 'long' }) + mark }));
        }
        if (keep && [...select.options].some(o => o.value === keep)) select.value = keep;
    }

    function loadState() {
        if (mode === 'daily') { const s = storage.get(cfg.dailyKey); return s && s.date === todayKey() ? s : null; }
        if (mode === 'archive') return (storage.get(cfg.dailyKey + '-archive') || {})[archiveDate] || null;
        return null;
    }

    function saveState(extra = {}) {
        if (mode === 'free') return;
        const st = { date: mode === 'daily' ? todayKey() : archiveDate, guesses, hintsUsed, gaveUp: false, won, ...extra };
        if (mode === 'daily') storage.set(cfg.dailyKey, st);
        else {
            const all = storage.get(cfg.dailyKey + '-archive') || {};
            all[archiveDate] = st;
            storage.set(cfg.dailyKey + '-archive', all);
        }
    }

    // ---------- Partie ----------
    // keep = true : redessiner la partie en cours (changement de langue) sans en recommencer une
    function startGame(newMode, keep = false) {
        if (!data.length) return;
        const previous = { secret: secretItem, guesses: guesses.slice(), hints: hintsUsed, lost: finished && !won };
        keep = keep && newMode === mode;
        mode = newMode;
        if (mode === 'archive') { fillArchive(); archiveDate = $('archiveDate').value; }
        guesses = [];
        rowStates = [];
        hintsUsed = 0;
        finished = false;
        won = false;

        if (mode === 'daily') secretItem = dailySecret(todayKey());
        else if (mode === 'archive') secretItem = dailySecret(archiveDate);
        else if (keep && previous.secret) secretItem = previous.secret;
        else {
            const pool = hard ? fullPool() : easyPool();
            let next;
            do { next = pool[Math.floor(Math.random() * pool.length)]; }
            while (pool.length > 1 && next === secretItem);
            secretItem = next;
        }

        for (const [id, m] of [['modeDaily', 'daily'], ['modeFree', 'free'], ['modeArchive', 'archive']]) {
            $(id).classList.toggle('active', mode === m);
            $(id).setAttribute('aria-selected', mode === m);
        }
        $('archiveBar').style.display = mode === 'archive' ? 'flex' : 'none';
        $('hardDetail').textContent = t('opt.hardDetail', { full: fullPool().length, easy: easyPool().length });

        $('results').innerHTML = '';
        $('specHeader').innerHTML = '';
        cfg.columns.forEach(c => $('specHeader').appendChild(el('div', { textContent: t(c.label) })));
        $('specHeader').style.display = 'none';
        $('emptyState').textContent = t('empty.' + category);
        $('emptyState').style.display = 'block';
        $('resultBar').style.display = 'none';
        $('shareFallback').style.display = 'none';
        $('searchInput').value = '';
        renderPrompt();
        renderBonus();
        renderHints();
        setInputEnabled(true);
        hideSuggestions();
        sizeTiles();

        const saved = loadState();
        if (saved) {
            hintsUsed = saved.hintsUsed || 0;
            saved.guesses.forEach(name => {
                const item = data.find(d => d['Nom'] === name);
                if (item && !finished) addGuess(item, false);
            });
            if ((saved.gaveUp || saved.lost) && !finished) endGame(false, false);
            renderHints();
        } else if (keep && mode === 'free') {
            hintsUsed = previous.hints;
            previous.guesses.forEach(name => {
                const item = data.find(d => d['Nom'] === name);
                if (item && !finished) addGuess(item, false);
            });
            if (previous.lost && !finished) endGame(false, false);
            renderHints();
        }
        renderCandidates();
        updateStatus();
        if (!finished && window.matchMedia('(hover: hover)').matches) $('searchInput').focus();
    }

    function renderPrompt() {
        const p = cfg.prompt && cfg.prompt(secretItem);
        $('prompt').style.display = p ? 'block' : 'none';
        if (!p) return;
        $('promptLabel').textContent = p.label;
        const text = $('promptText');
        text.innerHTML = '';
        if (p.items && p.items.length) {
            p.items.forEach((item, i) => {
                if (i) text.append(' + ');
                text.append(el('span', { className: 'prompt-item' }, icon('items', item, 'ico ico-lg'), item));
            });
        } else text.textContent = p.text;
    }

    // Bonus croisé : trouver l'arme du jour révèle la source du personnage du jour, et inversement.
    function renderBonus() {
        const partner = { weapons: 'characters', characters: 'weapons' }[category];
        const box = $('bonus');
        box.style.display = 'none';
        if (mode !== 'daily' || !partner) return;
        const saved = storage.get(CATEGORIES[partner].dailyKey);
        if (!saved || saved.date !== todayKey() || !saved.won) return;
        box.innerHTML = '';
        box.append(el('span', { className: 'label', textContent: t('bonus.' + partner) }), t('bonus.source', { x: tv(secretItem['Source']) }));
        box.style.display = 'block';
    }

    function renderHints() {
        const box = $('hints');
        box.innerHTML = '';
        const shown = finished ? cfg.hints.length : hintsUsed;
        cfg.hints.slice(0, shown).forEach((h, i) => {
            box.appendChild(el('div', { className: 'hint' + (i >= hintsUsed ? ' revealed' : '') },
                el('span', { className: 'label', textContent: t(i >= hintsUsed ? 'hint.unused' : 'hint.label', { i: i + 1 }) }),
                el('span', { lang: 'en', textContent: h(secretItem) })));
        });
        box.style.display = shown ? 'flex' : 'none';
    }

    function useHint() {
        if (finished || hintsUsed >= cfg.hints.length || guesses.length < HINT_STEPS[hintsUsed]) return;
        hintsUsed++;
        renderHints();
        saveState();
        updateStatus();
    }

    function updateStatus() {
        $('modeLabel').innerHTML = '';
        const pool = (mode === 'free' && hard) ? fullPool() : easyPool();
        $('modeLabel').append(
            mode === 'daily' ? `${t('label.' + category)} · ` : mode === 'archive' ? `${t('meta.archive')} · ` : `${t(hard ? 'meta.freeHard' : 'meta.free')} · `,
            el('b', { textContent: mode === 'daily' ? formatDay(todayKey(), { day: 'numeric', month: 'long' })
                : mode === 'archive' ? formatDay(archiveDate, { day: 'numeric', month: 'long' })
                : tn('meta.possible', pool.length) }));
        const n = guesses.length;
        $('guessCount').innerHTML = '';
        $('guessCount').append(el('b', { textContent: options.limit ? `${n}/${MAX_GUESSES}` : n }), ' ' + tn('guesses', n).replace(/^\S+\s/, ''));

        const btn = $('hintButton');
        if (hintsUsed >= cfg.hints.length) { btn.disabled = true; btn.textContent = t('hint.none'); }
        else {
            const need = HINT_STEPS[hintsUsed] - n;
            btn.disabled = finished || need > 0;
            btn.textContent = need > 0
                ? t(`hint.wait_${need === 1 ? 'one' : 'other'}`, { i: hintsUsed + 1, n: cfg.hints.length, k: need })
                : t('hint.button', { i: hintsUsed + 1, n: cfg.hints.length });
        }
        if (!giveUpTimer) $('giveUpButton').textContent = t('btn.giveUp');
        $('giveUpButton').disabled = finished || n === 0;
        $('gameActions').style.display = finished ? 'none' : 'flex';
    }

    function setInputEnabled(on) {
        $('searchInput').disabled = !on;
        $('validateButton').disabled = !on;
        $('searchInput').placeholder = on ? t('placeholder.' + category) : t('status.over');
    }

    // ---------- Comparaison ----------
    function compareSet(guess, secret) {
        const g = splitList(guess), s = new Set(splitList(secret).map(normalize));
        const hits = new Set(g.filter(x => s.has(normalize(x))));
        const state = hits.size === g.length && hits.size === s.size ? 'correct' : hits.size ? 'partial' : 'wrong';
        return { state, items: g, hits };
    }
    // Arme de départ : verte si identique, orange si les armes partagent un tag
    function compareLinked(guess, secret, gTags, sTags) {
        const base = compareSet(guess, secret);
        if (base.state === 'correct') return base;
        const s = new Set(splitList(sTags).map(normalize));
        const shared = splitList(gTags).filter(x => x !== 'N/A' && s.has(normalize(x)));
        return { state: shared.length ? 'partial' : 'wrong', items: base.items, hits: new Set(), shared };
    }
    function compareNumber(guess, secret, col) {
        const toNum = v => col.type === 'date' ? Number((v || '').replace(/-/g, ''))
            : col.type === 'ordinal' ? col.order.indexOf(v) + 1 : parseFloat(v);
        const g = toNum(guess), s = toNum(secret);
        if (isNaN(g) || isNaN(s) || !g || !s) return { state: normalize(guess) === normalize(secret) ? 'correct' : 'wrong' };
        if (g === s) return { state: 'correct' };
        return { state: 'wrong', arrow: s > g ? 'up' : 'down' };
    }
    function evaluate(item) {
        return cfg.columns.map(col => {
            const value = item[col.key] || 'N/A';
            const target = secretItem[col.key] || 'N/A';
            const res = col.type === 'set' ? compareSet(value, target)
                : col.type === 'linked' ? compareLinked(value, target, item[col.tagsKey], secretItem[col.tagsKey])
                : ['number', 'date', 'ordinal'].includes(col.type) ? compareNumber(value, target, col)
                : { state: normalize(value) === normalize(target) ? 'correct' : 'wrong' };
            return { value, col, ...res };
        });
    }

    const tileSize = () => parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile')) || 100;

    function renderTile(cell) {
        const div = el('div', { className: 'tile ' + cell.state + (cell.arrow ? ' ' + cell.arrow : '') });
        const content = el('span', { lang: 'en' });
        const tile = tileSize();
        const label = item => cell.col.abbr ? (STAT_ABBR[item] || item) : cell.col.translate ? tv(item) : item;
        const isList = (cell.col.type === 'set' || cell.col.type === 'linked') && cell.items && cell.items[0] !== 'Aucun' && cell.items[0] !== 'N/A';
        if (isList && cell.col.icons) {
            // Icônes (armes ou objets) au-dessus des noms
            const row = el('span', { className: 'tile-icons' });
            cell.items.slice(0, 3).forEach(item => {
                const ic = icon(cell.col.icons, item, 'ico ico-tile');
                if (cell.hits && cell.hits.has(item) && cell.state === 'partial') ic.classList.add('hit-ico');
                row.appendChild(ic);
            });
            div.appendChild(row);
        }
        if (isList && cell.col.abbr && cell.items.length > (tile < 70 ? 4 : 9)) {
            content.append(t('cell.manyStats', { n: cell.items.length }));
            if (cell.hits.size) content.append(el('small', { className: 'hitcount', textContent: ' ' + t('cell.common', { n: cell.hits.size }) }));
        } else if (isList) {
            cell.items.forEach((item, i) => {
                if (i) content.append(cell.col.abbr ? ' ' : ', ');
                content.append(cell.hits && cell.hits.has(item) && cell.state === 'partial' ? el('span', { className: 'hit', textContent: label(item) }) : label(item));
            });
        } else if (cell.col.type === 'date' && /^\d{4}-\d\d/.test(cell.value)) {
            content.textContent = formatDay(cell.value, { month: 'short', year: 'numeric' });
        } else {
            content.textContent = label(cell.value);
        }
        if (cell.shared && cell.shared.length) {
            content.append(el('small', { className: 'shared', textContent: cell.shared.join(', ') }));
            div.title = t('cell.commonTags', { x: cell.shared.join(', ') });
        } else if (isList) div.title = cell.items.map(label).join(', ');
        if (content.textContent.length > 28 || (isList && cell.col.icons)) div.classList.add('dense');
        // Réduit la police si le mot le plus long ne tient pas dans la case (au lieu de le couper)
        const longest = Math.max(...content.textContent.split(/[\s,]+/).map(w => w.length), 1);
        const base = div.classList.contains('dense') ? Math.min(12, Math.max(8, tile * 0.105)) : Math.min(15, Math.max(9, tile * 0.135));
        const fit = (tile * 0.84) / (longest * 0.62);
        if (fit < base) div.style.fontSize = Math.max(6.5, fit).toFixed(1) + 'px';
        div.appendChild(content);
        if (cell.arrow) div.appendChild(el('span', { className: 'sr-only', textContent: cell.arrow === 'up' ? '▲' : '▼' }));
        return div;
    }

    // ---------- Proposition ----------
    function searchItem() {
        if (finished) return;
        const input = normalize($('searchInput').value);
        hideSuggestions();
        if (!input) return;
        const item = data.find(d => normalize(d['Nom']) === input);
        if (!item) { toast(t('toast.unknown')); shake($('searchInput')); SFX.error(); return; }
        if (guesses.includes(item['Nom'])) { toast(t('toast.already')); shake($('searchInput')); SFX.error(); return; }
        addGuess(item, true);
        $('searchInput').value = '';
    }

    function guessIcon(item) {
        const kind = category === 'characters' || item['Type'] === 'Personnage' ? 'characters' : 'weapons';
        return icon(kind, item['Nom'], 'ico ico-name');
    }

    function addGuess(item, live) {
        guesses.push(item['Nom']);
        $('emptyState').style.display = 'none';
        $('specHeader').style.display = 'flex';

        const cells = evaluate(item);
        // Une proposition aux caractéristiques identiques à la réponse est indiscernable : elle gagne aussi.
        const samePrompt = !cfg.prompt || cfg.prompt(item).text === cfg.prompt(secretItem).text;
        const isWin = item === secretItem || (samePrompt && cells.every(c => c.state === 'correct'));
        const row = el('div', { className: 'row' });
        cells.forEach(cell => row.appendChild(renderTile(cell)));
        const guess = el('div', { className: 'guess' + (live ? '' : ' instant') + (isWin && live ? ' win' : '') },
            el('div', { className: 'guess-name' + (isWin ? ' correct-name' : '') }, guessIcon(item), item['Nom']), row);
        rowStates.push([isWin ? 'correct' : 'wrong', ...cells.map(c => c.state)]);
        $('results').prepend(guess);

        if (live) {   // un son par case, au rythme de leur apparition
            cells.forEach((c, i) => setTimeout(() => SFX[c.state === 'wrong' ? (c.arrow || 'wrong') : c.state](), 120 * i));
        }
        if (isWin) endGame(true, live);
        else if (options.limit && guesses.length >= MAX_GUESSES) endGame(false, live, true);
        else if (live) saveState();
        renderCandidates();
        updateStatus();
    }

    // Réponses encore compatibles avec toutes les cases affichées (option)
    function consistentCandidates() {
        const pool = mode === 'free' && hard ? fullPool() : easyPool();
        const guessed = guesses.map(n => data.find(d => d['Nom'] === n)).filter(Boolean);
        const sig = it => evaluate(it).map(c => c.state + (c.arrow || '')).join('|');
        const real = guessed.map(sig);
        const target = secretItem;
        const promptText = cfg.prompt ? cfg.prompt(target).text : null;
        const out = [];
        for (const c of pool) {
            if (guesses.includes(c['Nom'])) continue;
            if (promptText !== null && cfg.prompt(c).text !== promptText) continue;
            secretItem = c;
            if (guessed.every((g, i) => sig(g) === real[i])) out.push(c);
        }
        secretItem = target;
        return out;
    }

    function renderCandidates() {
        const box = $('candidates');
        if (!options.cands || finished || !secretItem) { box.style.display = 'none'; return; }
        const list = consistentCandidates();
        box.innerHTML = '';
        box.appendChild(el('span', { className: 'label', textContent: t('cands.label', { n: list.length }) }));
        const chips = el('div', { className: 'chips' });
        list.slice(0, 60).forEach(c => {
            const chip = el('button', { className: 'chip', type: 'button' }, c['Nom']);
            chip.onclick = () => { $('searchInput').value = c['Nom']; $('searchInput').focus(); };
            chips.appendChild(chip);
        });
        if (list.length > 60) chips.appendChild(el('span', { className: 'more', textContent: t('cands.more', { n: list.length - 60 }) }));
        box.appendChild(chips);
        box.style.display = 'block';
    }

    function recordStats(didWin) {
        const s = storage.get(cfg.statsKey) || { played: 0, won: 0, streak: 0, best: 0, lastWin: null };
        s.played++;
        if (didWin) {
            s.won++;
            s.streak = s.lastWin === yesterdayKey() ? s.streak + 1 : 1;
            s.best = Math.max(s.best, s.streak);
            s.lastWin = todayKey();
        } else s.streak = 0;
        storage.set(cfg.statsKey, s);
    }

    function endGame(didWin, live, outOfGuesses = false) {
        finished = true;
        won = didWin;
        setInputEnabled(false);
        hideSuggestions();
        const last = guesses[guesses.length - 1];
        $('resultText').textContent = didWin
            ? t('result.won', { tries: tn('guesses', guesses.length), name: last }) + (last !== secretItem['Nom'] ? t('result.indist', { name: secretItem['Nom'] }) : '')
            : (outOfGuesses ? t('result.outOfGuesses') : '') + t('result.lost', { name: secretItem['Nom'] });
        $('resultBar').classList.toggle('lost', !didWin);
        $('resultBar').style.display = 'flex';
        renderHints();
        renderCandidates();
        if (live) {
            saveState({ gaveUp: !didWin && !outOfGuesses, lost: !didWin, won: didWin });
            if (mode === 'daily') recordStats(didWin);
            if (didWin) setTimeout(() => { SFX.victory(); launchConfetti(); }, 800);
            setTimeout(openEndModal, didWin ? 1500 : 300);
        }
        updateStatus();
    }

    let giveUpTimer = null;
    function giveUp() {
        if (finished || !guesses.length) return;
        const btn = $('giveUpButton');
        if (!giveUpTimer) {
            btn.textContent = t('btn.giveUpConfirm');
            giveUpTimer = setTimeout(() => { giveUpTimer = null; btn.textContent = t('btn.giveUp'); }, 3000);
            return;
        }
        clearTimeout(giveUpTimer);
        giveUpTimer = null;
        btn.textContent = t('btn.giveUp');
        endGame(false, true);
    }

    // ---------- Fenêtre de résultat ----------
    function openEndModal() {
        const s = storage.get(cfg.statsKey) || { played: 0, won: 0, streak: 0, best: 0 };
        $('stPlayed').textContent = s.played;
        $('stWinPct').textContent = s.played ? Math.round(100 * s.won / s.played) : 0;
        $('stStreak').textContent = s.streak;
        $('stBest').textContent = s.best;
        $('statsLabel').textContent = t('stats.label', { x: t('label.' + category) });

        const title = $('endTitle');
        title.classList.remove('lost');
        if (finished) {
            title.textContent = t(won ? 'end.win' : 'end.lose');
            title.classList.toggle('lost', !won);
            const tries = tn('guesses', guesses.length);
            const sub = t(won ? 'end.foundIn' : 'end.after', { tries }) + (hintsUsed ? ' · ' + tn('hints', hintsUsed) : '');
            $('endWeapon').innerHTML = '';
            const pic = guessIcon(secretItem);
            pic.classList.add('ico-xl');
            $('endWeapon').append(pic, el('div', { textContent: secretItem['Nom'] }, el('small', { textContent: sub })));
            $('endWeapon').style.display = 'block';
            $('shareButton').style.display = '';
            $('shareXButton').style.display = '';
            $('shareXButton').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareText());
        } else {
            title.textContent = t('end.stats');
            $('endWeapon').style.display = 'none';
            $('shareButton').style.display = 'none';
            $('shareXButton').style.display = 'none';
        }
        $('shareFallback').style.display = 'none';

        clearInterval(countdownTimer);
        const tick = () => {
            const diff = secondsToParisMidnight();
            const pad = v => String(v).padStart(2, '0');
            $('countdown').innerHTML = '';
            $('countdown').append(t('countdown'),
                el('b', { textContent: `${pad(Math.floor(diff / 3600))}:${pad(Math.floor(diff / 60) % 60)}:${pad(diff % 60)}` }),
                el('small', { textContent: t('countdown.note') }));
            $('countdown').style.display = mode === 'daily' ? 'block' : 'none';
        };
        tick();
        countdownTimer = setInterval(tick, 1000);
        openModal('endModal');
    }

    function shareText() {
        const emoji = options.cb ? { correct: '🟦', partial: '🟧', wrong: '⬛' } : { correct: '🟩', partial: '🟧', wrong: '🟥' };
        const grid = rowStates.map(r => r.map(s => emoji[s]).join('')).join('\n');
        const name = `Vampire Survivordle · ${t('share.' + category)}`;
        const title = mode === 'daily' ? `${name} ${todayKey()}`
            : mode === 'archive' ? `${name} ${archiveDate} (${t('share.archive')})`
            : `${name} (${t('share.free')}${hard ? ', ' + t('share.hard') : ''})`;
        const score = won ? (options.limit ? `${guesses.length}/${MAX_GUESSES}` : tn('guesses', guesses.length))
            : (options.limit ? `X/${MAX_GUESSES}` : t('share.lost'));
        return `${title} : ${score}${hintsUsed ? ' · ' + '💡'.repeat(hintsUsed) : ''}\n${grid}`;
    }

    function shareResult() {
        const text = shareText();
        const fallback = () => {
            const box = $('shareFallback');
            box.value = text;
            box.rows = text.split('\n').length;
            box.style.display = 'block';
            box.focus();
            box.select();
            toast(t('toast.copyManual'));
        };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast(t('toast.copied')), fallback);
        else fallback();
    }

    // ---------- Suggestions ----------
    function hideSuggestions() {
        $('suggestions').style.display = 'none';
        suggestionIndex = -1;
    }

    function showSuggestions() {
        const input = normalize($('searchInput').value);
        const box = $('suggestions');
        box.innerHTML = '';
        suggestionIndex = -1;
        if (!input) { hideSuggestions(); return; }

        const matches = data
            .filter(d => !guesses.includes(d['Nom']) && normalize(d['Nom']).includes(input))
            .sort((a, b) => normalize(b['Nom']).startsWith(input) - normalize(a['Nom']).startsWith(input)
                || a['Nom'].localeCompare(b['Nom']));

        matches.forEach(match => {
            const start = normalize(match['Nom']).indexOf(input);
            const name = el('span', { className: 'sugg-name' }, guessIcon(match), match['Nom'].slice(0, start),
                el('mark', { textContent: match['Nom'].slice(start, start + input.length) }),
                match['Nom'].slice(start + input.length));
            const meta = match['Type'] && category === 'descriptions' ? `${tv(match['Type'])} · ${tv(match['Source'])}` : tv(match['Source']);
            const div = el('div', { role: 'option' }, name, el('small', { textContent: meta }));
            div.dataset.name = match['Nom'];
            div.onmousedown = e => {
                e.preventDefault();
                $('searchInput').value = match['Nom'];
                searchItem();
            };
            box.appendChild(div);
        });
        box.style.display = matches.length ? 'block' : 'none';
    }

    function moveSelection(delta) {
        const items = $('suggestions').children;
        if (!items.length) return;
        if (suggestionIndex >= 0) items[suggestionIndex].classList.remove('sel');
        suggestionIndex = (suggestionIndex + delta + items.length) % items.length;
        items[suggestionIndex].classList.add('sel');
        items[suggestionIndex].scrollIntoView({ block: 'nearest' });
    }

    $('searchInput').addEventListener('input', showSuggestions);
    $('searchInput').addEventListener('blur', () => setTimeout(hideSuggestions, 100));
    $('searchInput').addEventListener('keydown', e => {
        const box = $('suggestions');
        if (e.key === 'ArrowDown') { e.preventDefault(); moveSelection(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); moveSelection(-1); }
        else if (e.key === 'Escape') hideSuggestions();
        else if (e.key === 'Enter') {
            e.preventDefault();
            const items = box.children;
            const exact = data.some(d => normalize(d['Nom']) === normalize($('searchInput').value));
            if (box.style.display === 'block' && (suggestionIndex >= 0 || (!exact && items.length === 1))) {
                $('searchInput').value = items[Math.max(0, suggestionIndex)].dataset.name;
            }
            searchItem();
        }
    });

    // ---------- Transfert de progression (pas de serveur : un code à copier-coller) ----------
    function exportProgress() {
        const all = {};
        try {
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k.startsWith('vsdle-')) all[k] = localStorage.getItem(k);
            }
        } catch (e) { toast(t('toast.storage')); return; }
        const code = 'VSDLE1:' + btoa(unescape(encodeURIComponent(JSON.stringify(all))));
        const box = $('transferBox');
        box.value = code;
        box.select();
        if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => toast(t('toast.codeCopied')), () => toast(t('toast.copyManual')));
        else toast(t('toast.copyManual'));
    }

    let importArmed = false;
    function importProgress() {
        const code = $('transferBox').value.trim();
        let all;
        try {
            if (!code.startsWith('VSDLE1:')) throw new Error();
            all = JSON.parse(decodeURIComponent(escape(atob(code.slice(7)))));
        } catch (e) { toast(t('toast.badCode')); return; }
        if (!importArmed) {   // confirmation en deux clics : l'import remplace la progression de cet appareil
            importArmed = true;
            toast(t('toast.importConfirm'));
            setTimeout(() => { importArmed = false; }, 4000);
            return;
        }
        importArmed = false;
        try {
            Object.keys(localStorage).filter(k => k.startsWith('vsdle-')).forEach(k => localStorage.removeItem(k));
            Object.entries(all).forEach(([k, v]) => { if (k.startsWith('vsdle-')) localStorage.setItem(k, v); });
        } catch (e) { toast(t('toast.storage')); return; }
        toast(t('toast.imported'));
        $('transferBox').value = '';
        Object.assign(options, storage.get('vsdle-options') || {});
        hard = storage.get('vsdle-hard') === true;
        lang = storage.get('vsdle-lang') || lang;
        syncOptionInputs();
        applyTranslations();
        switchCategory(category);
    }

    // ---------- Démarrage ----------
    let shownDay = todayKey();
    setInterval(() => {
        if (todayKey() !== shownDay) { shownDay = todayKey(); if (mode === 'daily' && data.length) startGame('daily'); }
    }, 30000);

    syncOptionInputs();
    applyTranslations();
    const savedCat = storage.get('vsdle-category');
    switchCategory(CATEGORIES[savedCat] ? savedCat : 'weapons');
    if (!storage.get('vsdle-seen-help-v2')) { openModal('helpModal'); storage.set('vsdle-seen-help-v2', true); }
</script>
</body>
</html>
